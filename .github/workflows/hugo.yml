# Build the site with Hugo and deploy it to GitHub Pages.
# Based on Hugo's sample Pages workflow, without its Dart Sass, Go and Node steps (not
# needed), with Hugo installed from its own release and checksum-verified, and with
# every action pinned to a full commit SHA (Dependabot keeps them current).

name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that's running
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # The version the site is built and tested with locally
      HUGO_VERSION: 0.168.0
      HUGO_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Hugo
        run: |
          cd "${RUNNER_TEMP}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check --strict
          mkdir hugo
          tar -xzf "${tarball}" -C hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        env:
          # Whatever domain Pages is set to (github.io or the custom domain)
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo version
          hugo --gc --minify --baseURL "${BASE_URL}/"

      - name: Fail if any page would be hidden from search engines
        run: |
          if grep -rliE --include='*.html' '<meta[^>]*name="?robots"?[^>]*noindex' public; then
            echo "::error::The pages above have a noindex robots meta tag"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
