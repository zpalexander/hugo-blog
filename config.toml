baseURL = 'https://zpalexander.com/'
locale = 'en-us'
title = "Zach Alexander"
theme = "ananke"

# /robots.txt from the theme's template (allows crawling in production builds)
enableRobotsTXT = true

# The RSS feed also at /rss/ (Ghost's feed URL), so existing subscribers keep working;
# Hugo's own feed stays at /index.xml. Written as /rss/index.xml, which Pages serves for
# /rss/ as application/xml.
[outputFormats.GhostRSS]
  mediaType = "application/rss+xml"
  baseName = "index"
  path = "rss"
  isHTML = false
  noUgly = true

[outputs]
  home = ["html", "rss", "GhostRSS"]

# /posts/ is a 3-column grid, so 9 per page fills every row (Hugo's default is 10).
# The homepage sets its own page size (recent_posts_number, layouts/home.html).
[pagination]
  pagerSize = 9

# Code highlighting with CSS classes instead of inline styles, so colors can be adjusted:
# Monokai from assets/ananke/css/syntax-monokai.css, with two colors lightened in
# custom.css to meet WCAG AA contrast
[markup.highlight]
  noClasses = false

# Header nav links (rendered by the theme's site-navigation.html, overridden in
# layouts/_partials/site-navigation.html). pageRef lets Hugo mark the current page.
[[menus.main]]
  name = "Posts"
  pageRef = "/posts"
  weight = 10

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 20

[params]
  # <body> classes (theme default "avenir bg-near-white"): the body font, Lora, is set in custom.css
  body_classes = "bg-near-white"
  # the old Ghost site's favicon (16x16), from its zach-ghost theme
  favicon = "/favicon.ico"
  site_logo = "/images/logo.png"
  description = "Senior software engineer at Amazon. I do all things web."
  # choose a background color from any on this page: http://tachyons.io/docs/themes/skins/ and preface it with "bg-"
  background_color_class = "bg-black"
  # banner images fill the fixed-height banner and are cropped equally top and bottom
  # (theme default for the site banner: "cover bg-top", which crops only the bottom)
  featured_image_class = "cover bg-center"
  recent_posts_number = 5
  disable_share = true
  # GoatCounter analytics site code (https://zpalexander.goatcounter.com), used in
  # layouts/_partials/hooks/head-end.html
  goatcounter = "zpalexander"
  # dates like the old site: "20 December 2017"
  date_format = "2 January 2006"
  # post body justified (tachyons "tj") like the old site; its font is the body font, Lora (custom.css)
  post_content_classes = "tj"

# Default banner image for the homepage, list pages and 404 (Ananke 2.19 no longer falls
# back to a site-wide featured_image param). Single pages (posts, About) show a banner
# only if they set their own featured_image, like the old site.
[[cascade]]
  [cascade.params]
    featured_image = "/images/banner-snow-image.jpg"
  [cascade.target]
    kind = "{home,section,taxonomy,term,404}"

# The About page (/about/) shows no date (the theme's ananke.show_date switch)
[[cascade]]
  [cascade.params.ananke]
    show_date = false
  [cascade.target]
    path = "/about"

[params.ananke]
  # files in assets/ananke/css, bundled into the theme's main.css after the theme's own
  # styles, in this order. The order matters: custom.css overrides both the theme and
  # syntax-monokai.css, often with selectors of equal specificity.
  custom_css = ["syntax-monokai.css", "custom.css"]

[params.ananke.social.follow]
  networks = ["linkedin", "github", "rss"]

[params.ananke.social.linkedin]
  profilelink = "https://www.linkedin.com/in/zpalexander"

[params.ananke.social.github]
  profilelink = "https://github.com/zpalexander"

# The site's own RSS feed (identical to /rss/, the old Ghost feed URL); the theme ships the icon
[params.ananke.social.rss]
  profilelink = "/index.xml"
